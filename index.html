<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="WonderLoop — a dark futuristic interactive particle artwork"
    />
    <title>WonderLoop</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <canvas id="artboard" aria-label="WonderLoop particle artwork"></canvas>

    <div class="app-shell">
      <div class="hud-panel">
        <div class="brand-row">
          <span class="brand-dot"></span>
          <span class="eyebrow">WonderLoop</span>
        </div>

        <h1>WonderLoop</h1>

        <p class="tagline">
          Neon drift, orbital motion, and living light.
        </p>

        <div class="controls">
          <div class="theme-switcher" aria-label="Theme selector">
            <button class="theme-btn active" data-theme="cyan" type="button">
              Cyan
            </button>
            <button class="theme-btn" data-theme="violet" type="button">
              Violet
            </button>
            <button class="theme-btn" data-theme="aurora" type="button">
              Aurora
            </button>
            <button class="theme-btn" data-theme="sunset" type="button">
              Sunset
            </button>
          </div>

          <label class="speed-control" for="speed">
            <span>Animation Speed</span>
            <div class="speed-wrap">
              <input id="speed" type="range" min="0.4" max="2.2" step="0.1" value="1" />
              <output id="speedValue" for="speed">1.0x</output>
            </div>
          </label>

          <button id="downloadBtn" class="download-btn" type="button">
            Download artwork
          </button>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
