<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="WonderLoop is a mobile-first interactive generative art playground with glowing particles and live controls."
    />
    <title>WonderLoop</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <canvas id="artboard" aria-label="WonderLoop interactive art canvas"></canvas>

    <div class="shell">
      <header class="topbar" aria-label="WonderLoop controls header">
        <div class="brand" aria-label="WonderLoop home">
          <span class="brand-mark" aria-hidden="true"></span>
          <span>WonderLoop</span>
        </div>

        <div class="top-actions">
          <button id="pauseBtn" class="icon-button" type="button" aria-label="Pause artwork">
            Pause
          </button>
          <button id="fullscreenBtn" class="icon-button" type="button" aria-label="Toggle full screen">
            Fullscreen
          </button>
        </div>
      </header>

      <nav class="primary-nav" aria-label="WonderLoop sections">
        <button class="nav-btn active" type="button" data-target="create-panel">Create</button>
        <button class="nav-btn" type="button" data-target="discover-panel">Discover</button>
        <button class="nav-btn" type="button" data-target="favorites-panel">Favorites</button>
      </nav>

      <main class="panel-stack" aria-live="polite">
        <section id="create-panel" class="panel active" aria-label="Create universe controls">
          <div class="group">
            <div class="group-header">
              <span class="kicker">Palette</span>
            </div>
            <div id="paletteSwatches" class="palette-swatches" aria-label="Color palette selection"></div>
          </div>

          <div class="group controls-group">
            <div class="field">
              <label for="density">Particle density</label>
              <div class="range-wrap">
                <input id="density" type="range" min="30" max="180" step="1" value="92" />
                <output id="densityValue" for="density">92</output>
              </div>
            </div>

            <div class="field">
              <label for="speed">Animation speed</label>
              <div class="range-wrap">
                <input id="speed" type="range" min="0.4" max="2.4" step="0.1" value="1.2" />
                <output id="speedValue" for="speed">1.2x</output>
              </div>
            </div>

            <div class="field">
              <label for="glow">Glow</label>
              <div class="range-wrap">
                <input id="glow" type="range" min="0.4" max="2.2" step="0.1" value="1.3" />
                <output id="glowValue" for="glow">1.3</output>
              </div>
            </div>

            <div class="field">
              <label for="linkDistance">Connection distance</label>
              <div class="range-wrap">
                <input id="linkDistance" type="range" min="40" max="220" step="2" value="118" />
                <output id="linkDistanceValue" for="linkDistance">118</output>
              </div>
            </div>

            <div class="field">
              <label for="motion">Motion intensity</label>
              <div class="range-wrap">
                <input id="motion" type="range" min="0.4" max="2.2" step="0.1" value="1.1" />
                <output id="motionValue" for="motion">1.1</output>
              </div>
            </div>
          </div>

          <div class="group action-grid compact">
            <button id="createUniverseBtn" class="primary-button" type="button">Create New Universe</button>
            <button id="surpriseBtn" class="secondary-button" type="button">Surprise Me</button>
          </div>

          <div class="group action-grid compact">
            <button id="saveFavoriteBtn" class="secondary-button" type="button">Save Universe</button>
            <button id="resetBtn" class="ghost-button" type="button">Reset</button>
            <button id="downloadBtn" class="primary-button" type="button">Export PNG</button>
          </div>
        </section>

        <section id="discover-panel" class="panel" aria-label="Discover presets">
          <div class="group-header discover-header">
            <span class="kicker">Discover</span>
            <button id="shufflePresetBtn" class="ghost-button small" type="button">Shuffle</button>
          </div>
          <div id="presetGallery" class="preset-gallery" aria-live="polite"></div>
        </section>

        <section id="favorites-panel" class="panel" aria-label="Saved universes">
          <div class="group-header">
            <span class="kicker">Favorites</span>
          </div>
          <div id="favoritesEmpty" class="empty-state">
            No saved universes yet. Save a composition to revisit it later.
          </div>
          <div id="favoritesList" class="favorites-list" aria-live="polite"></div>
        </section>
      </main>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>

    <script src="script.js"></script>
  </body>
</html>
