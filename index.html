<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="WonderOS — immersive 3D browser operating system"
    />
    <title>WonderOS</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="appShell">
      <canvas id="threeCanvas" aria-label="WonderOS 3D scene"></canvas>
      <div id="lightingOverlay"></div>

      <header id="topbar" class="glass-panel topbar">
        <div class="status-group left">
          <span class="pill status-pill">Status</span>
          <span id="signalIndicator" class="status-dot"></span>
        </div>

        <div id="clockWrap" class="clock-wrap">
          <span id="clockText">00:00</span>
          <span id="dateText">Mon 01</span>
        </div>

        <div class="status-group right">
          <button id="homeBtn" class="chip-button" type="button">Home</button>
          <button id="launcherBtn" class="chip-button" type="button">Launcher</button>
          <button id="notificationsBtn" class="chip-button" type="button">Alerts</button>
        </div>
      </header>

      <main id="desktop">
        <section id="homeScreen" class="screen active">
          <div class="hero-panel glass-panel">
            <div class="hero-kicker">WonderOS</div>
            <h1>Fluid control. Focused flow.</h1>
            <p>Interactive systems engineered for clarity, calm, and creative motion.</p>
          </div>

          <div id="widgetStack" class="widget-stack"></div>
        </section>

        <div id="dock" class="dock glass-panel" aria-label="Application dock"></div>
        <aside id="launcherPanel" class="glass-panel hidden" aria-label="Application launcher"></aside>
      </main>

      <div id="windowLayer" aria-live="polite"></div>

      <aside id="notificationCenter" class="glass-panel hidden" aria-label="In-app notifications"></aside>

      <div id="toastLayer" aria-live="polite" aria-atomic="true"></div>

      <div id="fallbackNotice" class="fallback hidden" role="alert">
        WebGL is unavailable in this browser. The interface remains available, but the immersive 3D scene is disabled.
      </div>
    </div>

    <script type="module" src="./script.js"></script>
  </body>
</html>
