<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="WonderOS — an immersive 3D browser operating system"
    />
    <title>WonderOS</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="appShell">
      <canvas id="threeCanvas" aria-label="WonderOS 3D background"></canvas>
      <div id="ambientGlow"></div>

      <header id="topbar" class="glass-panel">
        <div class="status-groups left">
          <span class="pill">Status</span>
          <span class="signal"></span>
        </div>

        <div class="clock-wrap">
          <span id="clockText">00:00</span>
          <span id="dateText">Mon 01</span>
        </div>

        <div class="status-groups right">
          <button class="chip" type="button" id="homeBtn">Home</button>
          <button class="chip" type="button" id="launcherBtn">Launcher</button>
          <button class="chip" type="button" id="notificationsBtn">Alerts</button>
        </div>
      </header>

      <main id="desktop">
        <section id="homeScreen" class="screen active">
          <div class="hero glass-panel">
            <div class="eyebrow">WonderOS</div>
            <h1>Fluid control. Focused flow.</h1>
            <p>Interactive systems tuned for calm, clarity, and creative motion.</p>
          </div>
          <div id="widgetStack" class="widget-stack"></div>
        </section>

        <aside id="launcherPanel" class="glass-panel hidden" aria-label="Open apps">
          <div class="launcher-header">
            <input id="launcherSearch" type="search" placeholder="Search apps" aria-label="Search apps" />
            <button class="secondary-btn" type="button" id="closeLauncher">Close</button>
          </div>
          <div id="launcherGrid" class="launcher-grid"></div>
        </aside>
      </main>

      <nav id="dock" class="glass-panel" aria-label="Dock"></nav>
      <aside id="notificationCenter" class="glass-panel hidden"></aside>

      <div id="windowLayer"></div>
      <div id="toastLayer" aria-live="polite"></div>
      <div id="fallback" class="fallback hidden" role="alert">
        WebGL is unavailable in this browser. The system remains usable with the lightweight fallback mode.
      </div>
    </div>

    <script type="module" src="./script.js"></script>
  </body>
</html>
